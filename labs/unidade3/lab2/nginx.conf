server {
    listen 80;

    location /contador {
        set $upstream_flask http://flask:5000;
        proxy_pass $upstream_flask/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# resolver do DNS embutido do Docker Compose (127.0.0.11), com TTL curto --
# sem isso, o nginx resolve "flask" uma unica vez (na primeira request ou
# no load do config) e fixa nesse IP pro resto da vida do worker, entao
# escalar o servico (docker compose up --scale flask=3) nao tem efeito
# nenhum no balanceamento: todo pedido continua caindo no mesmo container.
resolver 127.0.0.11 valid=10s;

server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    #access_log  /var/log/nginx/host.access.log  main;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    # acesso ao contador -- proxy_pass com variavel forca o nginx a
    # resolver "flask" a cada request (respeitando o resolver acima) em
    # vez de resolver uma unica vez e fixar num IP so
    location /contador {
        set $upstream_flask http://flask:5000;
        proxy_pass $upstream_flask/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    #error_page  404              /404.html;

    # redirect server error pages to the static page /50x.html
    #
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

    
}